[workspace]
changelog_config = "cliff.toml"
publish = false
git_release_enable = true
git_tag_enable = true
# release-plz's DEFAULT tag template is `{{ package }}-v{{ version }}`, i.e. it
# hunts for `yupana-v0.3.1`. Every real tag in this repo is `v{{ version }}`. So it
# found NO baseline tag, concluded the package had never been released, and
# answered with a changelog regenerated from the scaffold commits and NO version
# bump — over 16 `feat` commits sitting above v0.3.1.
#
# Aligning the template to the repo's real convention is the fix, NOT renaming
# the tags: release.yml fires the binary build on `refs/tags/v*`, so a rename
# would break the deploy trigger to repair the detector.
#
# This is the same defect, and the same one-line fix, already proven on a sibling
# repo (bobbin e064e56) — where publish=false and release=true were red herrings
# and the tag-name mismatch was the actual blocker. Recorded here because the
# symptom ("nothing to release" / a no-op release PR) points at neither.
git_tag_name = "v{{ version }}"

[[package]]
name = "yupana"
