repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        types: [json]
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        args: []

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings -A missing-docs
        language: system
        types: [rust]
        pass_filenames: false

      - id: file-size-check
        name: file size check
        entry: scripts/check-file-size.sh
        language: script
        types: [rust]
        # The hook reads the files it is HANDED. With pass_filenames off it fell
        # back to the index, so `pre-commit run --all-files` checked nothing and
        # still reported Passed (yupana #83).
        pass_filenames: true
        # Show the hook's output even when it PASSES. It prints how many files it
        # examined (yupana #84), and pre-commit suppresses stdout for passing hooks
        # by default — so without this the subject count is visible only on the
        # failures it exists to make unnecessary. A count nobody can see in a green
        # log does not distinguish "checked 0" from "checked everything", which is
        # the whole defect.
        verbose: true

      - id: mdbook-build
        name: mdbook build
        entry: scripts/precommit-mdbook.sh
        language: script
        files: ^docs/book/
        pass_filenames: false
