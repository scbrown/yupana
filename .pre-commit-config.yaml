repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        types: [json]
      - id: check-merge-conflict
      - id: check-added-large-files
      # A private key must never reach this repo, which is public. There was no
      # secret scanner here at all until 2026-09-05, when a `git add -A` after a
      # verifier test run put a freshly generated PKCS#8 signing key
      # (.quipu/verifier.pk8) into a pushed branch with EVERY gate green — the
      # internal-identifier ratchet checks hostnames, not keys. `.quipu/` is now
      # gitignored, which handles the known path; this catches the next key that
      # arrives by a path nobody predicted.
      - id: detect-private-key

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.17.2
    hooks:
      - id: markdownlint-cli2
        args: []

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings -A missing-docs
        language: system
        types: [rust]
        pass_filenames: false

      - id: file-size-check
        name: file size check
        entry: scripts/check-file-size.sh
        language: script
        types: [rust]
        # The hook reads the files it is HANDED. With pass_filenames off it fell
        # back to the index, so `pre-commit run --all-files` checked nothing and
        # still reported Passed (yupana #83).
        pass_filenames: true
        # Show the hook's output even when it PASSES. It prints how many files it
        # examined (yupana #84), and pre-commit suppresses stdout for passing hooks
        # by default — so without this the subject count is visible only on the
        # failures it exists to make unnecessary. A count nobody can see in a green
        # log does not distinguish "checked 0" from "checked everything", which is
        # the whole defect.
        verbose: true

      - id: internal-identifier-ratchet
        name: internal identifier ratchet
        entry: cargo test --test no_internal_identifiers
        language: system
        types: [rust]
        pass_filenames: false

      - id: replay-converter-tests
        name: replay converter tests (python)
        entry: python3 tests/spool_to_dogwood.py
        language: system
        # The ONLY Rust-free test suite in the repo, and until now the only one
        # no gate ran. `just test` invoked it, so it passed whenever a human
        # typed that; CI ran `cargo test` and nothing else, and AGENTS.md says
        # the quality gates are the only gate. A converter that silently dropped
        # records would misreport the false-positive rate that gates the
        # advise -> enforce promotion, so it does not get to sit outside them.
        #
        # Placed here rather than in the CI test matrix on purpose: it has no
        # feature dependence, so the matrix would run it nine identical times,
        # while this covers `just check` (the stated pre-push gate) and CI's
        # pre-commit job at once.
        files: ^(tests/spool_to_dogwood\.py|scripts/spool-to-dogwood\.py)$
        pass_filenames: false
        # Same reason the file-size hook is verbose: show the test count in a
        # GREEN log. "OK" with no number cannot be told from a suite that
        # collected nothing.
        verbose: true

      - id: mdbook-build
        name: mdbook build
        entry: scripts/precommit-mdbook.sh
        language: script
        files: ^docs/book/
        pass_filenames: false

      - id: install-contract-test
        name: local install contract (one full-feature binary, two names)
        entry: scripts/selftest-install-local.sh
        language: script
        files: ^(scripts/(install-local|selftest-install-local)\.sh|justfile|Cargo\.(toml|lock)|\.github/workflows/release\.yml)$
        pass_filenames: false
        verbose: true

      - id: session-reread-tests
        name: session reread discrimination (python)
        entry: python3 scripts/session-reread-guard.py --selftest
        language: system
        files: ^(scripts/(session-reread-guard|session_trajectory)\.py|justfile)$
        pass_filenames: false
        verbose: true

      - id: session-depth-tests
        name: session depth and signal loss discrimination (python)
        entry: python3 tests/session_depth.py
        language: system
        files: ^((scripts|tests)/session_depth\.py|scripts/session_trajectory\.py|justfile)$
        pass_filenames: false
        verbose: true
