name: Release

# Publish a downloadable yupana binary on every version tag. CI (ci.yml) proves the
# code builds/tests; this proves it SHIPS — a build with no release artifact is a
# tool nobody downstream can install (aegis-dh32).
on:
  push:
    tags: ["v*"]
    branches: [main]
  # Manual re-run of the binary build for an existing tag — e.g. when a tag was
  # created by release-plz (see the `binary` job's trigger note) or the upload
  # leg failed after the release already existed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the binary to (e.g. v0.5.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # create the GitHub release + upload the asset

jobs:
  binary:
    name: Release binary (x86_64-linux-gnu)
    needs: release-plz
    # ⚠ A TAG PUSH IS NOT ENOUGH, AND THAT IS NOT A BUG IN THIS FILE.
    #
    # Measured on v0.5.0: release-plz created the tag and the GitHub release with
    # GITHUB_TOKEN, and GitHub DELIBERATELY does not re-trigger workflows from
    # token-authored tag pushes. So `on: push: tags` never fired, and v0.5.0
    # shipped with a correct changelog and NO BINARY — the exact "a build with no
    # release artifact is a tool nobody downstream can install" failure the header
    # of this file is about. v0.4.0 had its asset only because a human pushed that
    # tag by hand, which is not a process.
    #
    # Sibling quipu hit this first and fixed it the same way: run the artifact
    # build as a JOB IN THIS WORKFLOW, gated on release-plz having created a
    # release, rather than on a trigger that cannot fire. The tag-push arm stays
    # for hand-pushed tags; workflow_dispatch is the escape hatch for a tag that
    # already exists.
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/') ||
       github.event_name == 'workflow_dispatch' ||
       needs.release-plz.outputs.releases_created == 'true')
    # ubuntu-22.04 ships glibc 2.35 — older than every consumer host, so a
    # dynamically-linked binary built here runs on all of them (build on the
    # OLDEST glibc you must support; forward-compat only). Static musl is a
    # follow-up once the C-dep toolchain (musl-tools) is wired in.
    runs-on: ubuntu-22.04
    steps:
      # fetch-depth: 0 so the tag this run is about is present locally — on the
      # release-merge path the ref is `main`, not the tag, and the checkout has
      # to be moved onto the tag before anything is built from it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Toolchain BEFORE the resolve step: it shells out to `cargo metadata`, and
      # depending on a runner image happening to preinstall cargo is the kind of
      # assumption that breaks on an image bump and looks like a tagging bug.
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve the tag this run is about
        id: tag
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch) TAG="${{ inputs.tag }}" ;;
            *)
              if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                TAG="${GITHUB_REF_NAME}"
              else
                # release-plz has already bumped and committed Cargo.toml in the
                # commit this run is building, and tags it v<version>. Deriving
                # the tag from the manifest avoids depending on the shape of the
                # action's undocumented `releases` JSON output.
                TAG="v$(cargo metadata --no-deps --format-version 1 \
                  | jq -r '.packages[] | select(.name == "yupana") | .version')"
              fi ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG}"

      # Build FROM THE TAG, not from whatever the trigger ref happened to be. A
      # binary labelled v0.5.0 that was built from a later main is a mislabelled
      # artifact, which is worse than a missing one.
      - name: Check out the tag
        run: git checkout --detach "refs/tags/${{ steps.tag.outputs.tag }}"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      # mcp + langs-extra = the useful runtime set (`yupana serve` + all grammars);
      # quipu added 2026-07-23 (aegis-ucoh): the promote seam shipped feature-less,
      # so the DEPLOYED `yupana promote` was a stub — and its exit-0 made the
      # quipu-ingest cron advance its marker past a commit that was never
      # promoted. All arms pass in ci.yml (quipu + mcp,quipu arms), so this
      # remains a proven build.
      - name: Build release binary
        run: cargo build --release --features mcp,langs-extra,quipu

      - name: Package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          bin=target/release/yupana
          test -x "$bin" || { echo "no binary at $bin"; exit 1; }
          "$bin" --version
          # `hank` is the legacy command name still used by deployed hooks and
          # scripts. Ship one build under both names: a relative symlink keeps
          # the archive relocatable and makes feature/version drift impossible.
          ln -sfn yupana target/release/hank
          test "$(readlink target/release/hank)" = yupana
          tarball="yupana-${TAG}-x86_64-linux-gnu.tar.gz"
          tar -czf "$tarball" -C target/release yupana hank
          sha256sum "$tarball" | tee "$tarball.sha256"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Publish release + asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The API is the flaky part, not the build. v0.1.0's first run built and
          # packaged fine and then lost the whole release to a transient
          # "HTTP 503: No server is currently available" from api.github.com. A
          # release that discards a good binary because an API blipped is a
          # publish step that fails for reasons unrelated to the artifact — so
          # retry with backoff before giving up.
          # Be patient: a tag fires this workflow once, so giving up early
          # strands the release behind a blip that has already passed. v0.1.0's
          # second run burned all 5 attempts inside a ~4min uploads.github.com
          # 503/504 window and failed with a perfectly good binary in hand; the
          # same job re-run untouched published first try. Backoff caps at 60s
          # and runs ~9min total — longer than the outages actually observed,
          # still bounded so a real failure doesn't hang the runner.
          retry() {
            local n=1 max=12 delay
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                echo "::error::giving up after $n attempts: $*"
                return 1
              fi
              delay=$((n * 15))
              [ "$delay" -gt 60 ] && delay=60
              echo "attempt $n failed: $* — retrying in ${delay}s"
              sleep "$delay"
              n=$((n + 1))
            done
          }
          # Create the release if the tag has none yet; either way, attach the asset.
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            retry gh release create "${TAG}" \
              --title "${TAG}" --generate-notes
          fi
          retry gh release upload "${TAG}" \
            "${TARBALL}" "${TARBALL}.sha256" --clobber
          # Assert the effect, not the exit code: the asset must actually be listed.
          gh release view "${TAG}" --json assets \
            --jq '.assets[].name' | grep -q "${TARBALL}"
          echo "published ${TARBALL} on ${TAG}"

  # Open/refresh the release PR on every main push; merging it tags + releases.
  # This job is WHY releases happen at all: release-plz.toml existed here for
  # weeks while nothing executed it, and 43 commits piled up unreleased behind
  # a tag-only workflow (config-as-prose — the control existed, never ran).
  release-plz:
    name: Release-plz
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    # Consumed by `binary` above: on a release-merge push this is how the
    # artifact build learns a tag was just created, since the tag push itself
    # cannot trigger anything.
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: MarcoIeni/release-plz-action@v0.5
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # git-cliff + python3 for the corrector below. Installed AFTER release-plz so a
      # tool-install failure cannot be mistaken for a release-plz failure.
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      # ⛔ WITHOUT THIS STEP release-plz SILENTLY DISCARDS ITS OWN CORRECT CHANGELOG
      # WHEN IT UPDATES THE RELEASE PR. Measured on #81 (aegis-z3oz35, 2026-09-16):
      #
      #   PR #79 merged 07:30:18Z -> release-plz opened #81 over v0.9.1..1563064.
      #     Changelog run 35069095888, head ea93a294 -> SUCCESS. 4 commits, correct.
      #   PR #80 merged 07:35:13Z -> release-plz force-pushed #81 onto the new main
      #     and REPLACED the 0.9.2 section with only the 1563064..ddb8610 delta.
      #     Changelog run 35069490939, head c37d1d27 -> FAILURE. The 4 were gone.
      #
      # The two sets are exact graph deltas — `git log v0.9.1..1563064 --no-merges`
      # is precisely what the update dropped. So on the UPDATE path release-plz
      # regenerates the section over the commits added since its OWN PREVIOUS RUN
      # rather than since the last release tag, and overwrites instead of extending.
      #
      # This is a RACE, not changelog sloppiness: it fires whenever a second PR
      # merges while a release PR is open. Nothing is misconfigured — the same
      # cliff.toml and release-plz.toml produced a green section four minutes
      # earlier. Hand-adding the dropped entries would not prevent the next one, and
      # a hand-correction does not survive anyway: release-plz abandons a branch it
      # did not write, so the next push to main closes the PR and reopens it with the
      # defect back (measured on quipu #61).
      #
      # It therefore has to run HERE, inline, right after the PR is (re)generated.
      # A workflow triggered on `push` to `release-plz-**` would never fire —
      # release-plz pushes with GITHUB_TOKEN and GitHub does not re-trigger workflows
      # from token-authored pushes, the same reason `binary` and `crates` are jobs in
      # this file rather than `release: published` triggers.
      #
      # fix-changelog.sh is idempotent and drops release-mechanics commits from the
      # body, so its own correction commit does not become a new entry needing
      # another correction.
      - name: Correct the release PR's changelog section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BR="$(gh pr list --state open --json headRefName \
                  --jq '[.[] | select(.headRefName | startswith("release-plz"))][0].headRefName // ""')"
          if [ -z "$BR" ]; then
            echo "No open release PR — nothing to correct."
            exit 0
          fi
          echo "Correcting release PR branch: ${BR}"
          git fetch --quiet origin "$BR"
          git checkout --quiet -B "$BR" "origin/$BR"

          ./scripts/fix-changelog.sh

          if git diff --quiet -- CHANGELOG.md; then
            echo "Section was already correct; nothing pushed."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore: regenerate the release changelog section with git-cliff"
            git push origin "$BR"
            echo "Pushed a corrected section to ${BR}."
          fi

          # Fail loudly if the correction did not actually satisfy the verifier — a
          # corrector that silently produces a still-wrong section is worse than no
          # corrector, because the red check that used to catch it is gone.
          ./scripts/verify-changelog.sh

  # THE REAL CRATES LANE (aegis-pz5crt, ported from quipu's aegis-pb4rzi fix).
  # It lives HERE, not in crates.yml, for exactly the reason the `binary` job
  # above already explains at length: release-plz creates the release and the tag
  # with GITHUB_TOKEN, and GitHub does not trigger workflows from GITHUB_TOKEN
  # events. crates.yml triggers on `release: [published]`, so on a real release
  # it never ran at all.
  #
  # On quipu that left crates.io six versions behind while the publish workflow
  # showed a green run that moved nothing. Here it left the crate UNPUBLISHED —
  # crates.io has no `yupana`, only the pre-rename `hank` at 0.4.0 from the
  # archived repository.
  # THE CHANGELOG GATE, on the trigger that actually fires (aegis-snglaf).
  #
  # yupana had NO changelog verification of any kind, and v0.8.1 shipped missing
  # TWO entries: a `fix(install)` git-cliff dropped, and a nonconventional squash
  # subject it filtered out by design. Both were found by hand. A release whose
  # changelog omits a behaviour change is the shape this exists to refuse.
  #
  # Ported from quipu, where the pull_request copy has NEVER EXECUTED: bot-authored
  # release PRs sit `action_required` until a human approves, so the push copy is the
  # one that protects releases. Keep both — the PR one covers human CHANGELOG edits.
  #
  # ⚠ THE DARKNESS APPLIES HERE TOO — and the obvious check says it does not.
  # Measured and then CORRECTED the same hour (aegis-z3oz35, 2026-09-16).
  #
  # I first read two runs on this repo's release-PR branch as proof that the
  # `pull_request` copy executes on bot-authored heads:
  #
  #   run 35069095888  head ea93a294  github-actions[bot]  success  19s
  #   run 35069490939  head c37d1d27  github-actions[bot]  failure  12s
  #
  # Real durations, real conclusions, right branch, right author. The conclusion
  # was still WRONG. Both are `run_attempt: 2` — attempt 1 of each sat
  # `action_required` and a human clicked Approve. The tell is in the timestamps,
  # not the conclusion:
  #
  #   35069490939  created 07:37:39Z  run_started 07:48:12Z   <- an 11-minute
  #                                                              approval gap
  #   35073841251  created 08:27:07Z  run_started 08:27:07Z  attempt 1
  #                -> action_required, 0s, never executed
  #
  # So a conclusion of `success` on a bot-authored head means "a human approved
  # this", not "this gate is unattended". `conclusion` and `duration` cannot tell
  # the two apart. **Read `run_attempt` and compare `created_at` with
  # `run_started_at`.** attempt 2 with a gap = it was dark and somebody opened it.
  #
  # Operational consequence: after the corrector above pushes a fixed section, the
  # release PR's required checks sit `action_required` until approved, and the PR
  # shows BLOCKED with nothing red on it. That is the gate working, not a failure —
  # approve the runs (`gh api -X POST repos/OWNER/REPO/actions/runs/<id>/approve`)
  # and read the attempt-2 result.
  #
  # The unattended copy is the `verify-changelog` job below, which runs on `push`
  # to main and needs no approval. That is why both exist.
  verify-changelog:
    name: Verify changelog
    needs: release-plz
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags: the verifier ranges over <prev>..HEAD
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the newest section on main
        run: ./scripts/verify-changelog.sh

      # The pending release PR is the artifact that actually gets merged, and it is
      # regenerated on every push — so it is worth re-checking every push, not just
      # at creation. Without this, the corrector above is unwitnessed: if it ever
      # stops working the first sign would be a bad changelog on a tag.
      - name: Verify the pending release PR, if there is one
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BR="$(gh pr list --state open --json headRefName \
                  --jq '[.[] | select(.headRefName | startswith("release-plz"))][0].headRefName // ""')"
          if [ -z "$BR" ]; then
            echo "No open release PR — nothing to verify."
            exit 0
          fi
          echo "Verifying pending release PR branch: ${BR}"
          git fetch --quiet origin "${BR}:refs/remotes/origin/${BR}" || {
            echo "::warning::could not fetch ${BR}"; exit 0; }
          ./scripts/verify-changelog.sh --at "refs/remotes/origin/${BR}"

  crates:
    name: Publish to crates.io
    # AFTER the binary. A release whose artifact failed to build should not be
    # announced to the registry, and a crates.io version is permanent.
    needs: [release-plz, binary]
    if: >-
      always() &&
      startsWith(github.ref, 'refs/heads/') &&
      needs.release-plz.outputs.releases_created == 'true' &&
      needs.binary.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # THE TAG, NOT Cargo.toml. The action refuses to publish when the crate is
      # not at the version the caller intended, and that check is only worth
      # anything if the two numbers come from different places. Reading git refs
      # is independent of the manifest; deriving it with `cargo metadata` would
      # compare a number to itself.
      - name: Resolve the released version from the tag
        id: want
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          # ANCESTRY + TREE, not points-at (aegis-snglaf, ported from quipu PR166).
          # points-at refused v0.8.1: release-plz tags the PR's own commit, and a
          # merge-commit merge leaves main's HEAD one above it, so nothing points at
          # HEAD and a valid release is refused. The resolver requires the tag to be
          # REACHABLE from HEAD and its TREE to equal HEAD's, which is strictly
          # stronger — a commit that landed after the tag is still refused.
          # Exit 2 means the clone is SHALLOW and no conclusion is available; that is
          # a checkout fault, not a tag fault, and must not read as "no tag".
          RESOLVED="$(.github/scripts/resolve-release-tag.sh .)" || {
            rc=$?
            [ "$rc" = 2 ] && echo "::error::shallow checkout — needs fetch-depth: 0"
            exit "$rc"
          }
          TAG="${RESOLVED%%	*}"
          echo "want=${RESOLVED##*	}" >> "$GITHUB_OUTPUT"
          echo "tag ${TAG} -> version ${RESOLVED##*	}"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2

      # ⛔ THE FIRST REAL PUBLISH CLAIMS THE NAME, AND THAT IS STIWI'S CALL.
      #
      # `yupana` does not exist on crates.io. Making this lane work does not
      # resume a practice, it starts one — and a crates.io name cannot be
      # released, nor a version unpublished (only yanked). The decision sits on
      # the Desk CRATES card as a first publish under Stiwi's own token.
      #
      # So until the repository variable CRATES_PUBLISH_ENABLED is set to
      # "true", this runs in DRY-RUN mode: every guard, the packaging, and the
      # registry read all execute, and nothing is published.
      #
      # This is a VARIABLE rather than a comment because a merge gate that lives
      # only in prose does not survive the merge. It is deliberately NOT a
      # skipped job either — a skipped job is invisible, whereas the dry-run
      # branch says in the log that it published nothing, which is the whole
      # point of defect 2 above.
      #
      # AND IT IS NOT "SAFE BECAUSE TRUSTED PUBLISHING IS UNCONFIGURED". That
      # reasoning expires silently the moment TP is configured. This gate does
      # not consult TP, and neither do any of the refusals in the action.
      - uses: ./.github/actions/crates-publish
        with:
          expected-version: ${{ steps.want.outputs.want }}
          dry-run: ${{ vars.CRATES_PUBLISH_ENABLED != 'true' }}
