name: Release

# Publish a downloadable yupana binary on every version tag. CI (ci.yml) proves the
# code builds/tests; this proves it SHIPS — a build with no release artifact is a
# tool nobody downstream can install (aegis-dh32).
on:
  push:
    tags: ["v*"]
    branches: [main]
  # Manual re-run of the binary build for an existing tag — e.g. when a tag was
  # created by release-plz (see the `binary` job's trigger note) or the upload
  # leg failed after the release already existed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach the binary to (e.g. v0.5.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # create the GitHub release + upload the asset

jobs:
  binary:
    name: Release binary (x86_64-linux-gnu)
    needs: release-plz
    # ⚠ A TAG PUSH IS NOT ENOUGH, AND THAT IS NOT A BUG IN THIS FILE.
    #
    # Measured on v0.5.0: release-plz created the tag and the GitHub release with
    # GITHUB_TOKEN, and GitHub DELIBERATELY does not re-trigger workflows from
    # token-authored tag pushes. So `on: push: tags` never fired, and v0.5.0
    # shipped with a correct changelog and NO BINARY — the exact "a build with no
    # release artifact is a tool nobody downstream can install" failure the header
    # of this file is about. v0.4.0 had its asset only because a human pushed that
    # tag by hand, which is not a process.
    #
    # Sibling quipu hit this first and fixed it the same way: run the artifact
    # build as a JOB IN THIS WORKFLOW, gated on release-plz having created a
    # release, rather than on a trigger that cannot fire. The tag-push arm stays
    # for hand-pushed tags; workflow_dispatch is the escape hatch for a tag that
    # already exists.
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/') ||
       github.event_name == 'workflow_dispatch' ||
       needs.release-plz.outputs.releases_created == 'true')
    # ubuntu-22.04 ships glibc 2.35 — older than every consumer host, so a
    # dynamically-linked binary built here runs on all of them (build on the
    # OLDEST glibc you must support; forward-compat only). Static musl is a
    # follow-up once the C-dep toolchain (musl-tools) is wired in.
    runs-on: ubuntu-22.04
    steps:
      # fetch-depth: 0 so the tag this run is about is present locally — on the
      # release-merge path the ref is `main`, not the tag, and the checkout has
      # to be moved onto the tag before anything is built from it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Toolchain BEFORE the resolve step: it shells out to `cargo metadata`, and
      # depending on a runner image happening to preinstall cargo is the kind of
      # assumption that breaks on an image bump and looks like a tagging bug.
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve the tag this run is about
        id: tag
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch) TAG="${{ inputs.tag }}" ;;
            *)
              if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
                TAG="${GITHUB_REF_NAME}"
              else
                # release-plz has already bumped and committed Cargo.toml in the
                # commit this run is building, and tags it v<version>. Deriving
                # the tag from the manifest avoids depending on the shape of the
                # action's undocumented `releases` JSON output.
                TAG="v$(cargo metadata --no-deps --format-version 1 \
                  | jq -r '.packages[] | select(.name == "yupana") | .version')"
              fi ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: ${TAG}"

      # Build FROM THE TAG, not from whatever the trigger ref happened to be. A
      # binary labelled v0.5.0 that was built from a later main is a mislabelled
      # artifact, which is worse than a missing one.
      - name: Check out the tag
        run: git checkout --detach "refs/tags/${{ steps.tag.outputs.tag }}"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      # mcp + langs-extra = the useful runtime set (`yupana serve` + all grammars);
      # quipu added 2026-07-23 (aegis-ucoh): the promote seam shipped feature-less,
      # so the DEPLOYED `yupana promote` was a stub — and its exit-0 made the
      # quipu-ingest cron advance its marker past a commit that was never
      # promoted. All arms pass in ci.yml (quipu + mcp,quipu arms), so this
      # remains a proven build.
      - name: Build release binary
        run: cargo build --release --features mcp,langs-extra,quipu

      - name: Package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          bin=target/release/yupana
          test -x "$bin" || { echo "no binary at $bin"; exit 1; }
          "$bin" --version
          tarball="yupana-${TAG}-x86_64-linux-gnu.tar.gz"
          tar -czf "$tarball" -C target/release yupana
          sha256sum "$tarball" | tee "$tarball.sha256"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Publish release + asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # The API is the flaky part, not the build. v0.1.0's first run built and
          # packaged fine and then lost the whole release to a transient
          # "HTTP 503: No server is currently available" from api.github.com. A
          # release that discards a good binary because an API blipped is a
          # publish step that fails for reasons unrelated to the artifact — so
          # retry with backoff before giving up.
          # Be patient: a tag fires this workflow once, so giving up early
          # strands the release behind a blip that has already passed. v0.1.0's
          # second run burned all 5 attempts inside a ~4min uploads.github.com
          # 503/504 window and failed with a perfectly good binary in hand; the
          # same job re-run untouched published first try. Backoff caps at 60s
          # and runs ~9min total — longer than the outages actually observed,
          # still bounded so a real failure doesn't hang the runner.
          retry() {
            local n=1 max=12 delay
            until "$@"; do
              if [ "$n" -ge "$max" ]; then
                echo "::error::giving up after $n attempts: $*"
                return 1
              fi
              delay=$((n * 15))
              [ "$delay" -gt 60 ] && delay=60
              echo "attempt $n failed: $* — retrying in ${delay}s"
              sleep "$delay"
              n=$((n + 1))
            done
          }
          # Create the release if the tag has none yet; either way, attach the asset.
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            retry gh release create "${TAG}" \
              --title "${TAG}" --generate-notes
          fi
          retry gh release upload "${TAG}" \
            "${TARBALL}" "${TARBALL}.sha256" --clobber
          # Assert the effect, not the exit code: the asset must actually be listed.
          gh release view "${TAG}" --json assets \
            --jq '.assets[].name' | grep -q "${TARBALL}"
          echo "published ${TARBALL} on ${TAG}"

  # Open/refresh the release PR on every main push; merging it tags + releases.
  # This job is WHY releases happen at all: release-plz.toml existed here for
  # weeks while nothing executed it, and 43 commits piled up unreleased behind
  # a tag-only workflow (config-as-prose — the control existed, never ran).
  release-plz:
    name: Release-plz
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    # Consumed by `binary` above: on a release-merge push this is how the
    # artifact build learns a tag was just created, since the tag push itself
    # cannot trigger anything.
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: MarcoIeni/release-plz-action@v0.5
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
