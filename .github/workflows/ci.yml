name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: default
            flags: ""
          - name: mcp
            flags: "--features mcp"
          - name: langs-extra
            flags: "--features langs-extra"
          - name: quipu
            flags: "--features quipu"
          - name: mcp+quipu
            flags: "--features mcp,quipu"
          - name: game-state
            flags: "--features game-state"
          - name: mcp+game-state
            flags: "--features mcp,game-state"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-${{ matrix.name }}-
            ${{ runner.os }}-cargo-
      - run: cargo clippy ${{ matrix.flags }} --all-targets -- -D warnings -A missing-docs

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: default
            flags: ""
          - name: mcp
            flags: "--features mcp"
          - name: langs-extra
            flags: "--features langs-extra"
          - name: quipu
            flags: "--features quipu"
          - name: mcp+quipu
            flags: "--features mcp,quipu"
          - name: game-state
            flags: "--features game-state"
          - name: mcp+game-state
            flags: "--features mcp,game-state"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-${{ matrix.name }}-
            ${{ runner.os }}-cargo-
      - run: cargo test ${{ matrix.flags }}

  # Feature arms join the matrix as their engines land, so a feature can never
  # "ship dark" (Bobbin's hard-won lesson). --features quipu joined in Phase 4
  # (promotion): its tests are in-process (rudof SHACL) and the refusal path
  # returns before any network call, so the arm needs no live Quipu.
  #
  # --features game-state joined with the FR-35..FR-39 harness, in the same
  # change that added the feature. Both arms are needed, not just the combined
  # one: `game-state` alone covers the engine and its tenancy, and
  # `mcp,game-state` is the only arm that compiles the /ingest, /guard and
  # /whatif surfaces plus the three MCP tools. The engine is pure in-memory —
  # no network, no fixtures — so both are self-contained.

  # The browser target cannot ship dark either: same principle as the feature
  # arms above, but keyed on TARGET rather than feature (the wasm boundary is
  # a cfg(target_arch), which unlike a feature cannot be toggled into a lie).
  # `just wasm check` builds the lib AND a linked cdylib (a bare --lib build
  # never links, so it cannot check the properties embedders rely on), then a
  # Node script instantiates it with an empty import object — asserting the
  # module is self-contained — and drives a real extraction through it.
  wasm:
    name: WASM (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: default
            features: ""
          - name: langs-extra
            features: "langs-extra"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # wasi-libc supplies the C headers tree-sitter compiles against and the
      # libc.a its pure in-memory functions link from (see build.rs).
      - run: sudo apt-get update && sudo apt-get install -y wasi-libc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ matrix.name }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-${{ matrix.name }}-
            ${{ runner.os }}-cargo-
      - uses: extractions/setup-just@v2
      - run: just wasm check "${{ matrix.features }}"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo build

  check:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      # Both skips are justified ONLY because a dedicated job covers each on the
      # SAME triggers (yupana #84 asked whether this list had outlived its reason):
      #   cargo-clippy  -> the Clippy matrix above, 5 arms, --all-targets -D warnings
      #   mdbook-build  -> the `book` job below
      # `book` exists because that second claim used to be false. The only mdbook
      # build was docs.yml, which runs on push-to-main behind a `docs/book/**`
      # path filter and never on pull_request — so a PR could not break the book
      # in CI, and a broken book was only discovered after merge.
      - run: pre-commit run --all-files
        env:
          SKIP: mdbook-build,cargo-clippy

  book:
    name: Book builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/mdbook
          key: ${{ runner.os }}-mdbook-0.4
      - name: Install mdbook
        run: command -v mdbook || cargo install mdbook --version "^0.4" --locked
      - run: mdbook build docs/book

  lint-markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx markdownlint-cli2
