  <g class="div" stroke-linecap="round">
    <line x1="263.3" y1="115.0" x2="263.3" y2="137.0"/>
    <line x1="336.7" y1="115.0" x2="336.7" y2="137.0"/>
    <line x1="410.0" y1="115.0" x2="410.0" y2="137.0"/>
    <line x1="483.3" y1="115.0" x2="483.3" y2="137.0"/>
    <line x1="556.7" y1="115.0" x2="556.7" y2="137.0"/>
  </g>
  <g>
    <circle cx="213.7" cy="126.0" r="3.6" fill="#E07A5F"/>
    <circle cx="226.7" cy="126.0" r="3.6" fill="#E07A5F"/>
    <circle cx="239.7" cy="126.0" r="3.3000000000000003" class="empty"/>
    <circle cx="293.5" cy="126.0" r="3.6" fill="#F2CC8F"/>
    <circle cx="306.5" cy="126.0" r="3.6" fill="#F2CC8F"/>
    <circle cx="373.3" cy="126.0" r="3.6" fill="#81B29A"/>
    <circle cx="433.7" cy="126.0" r="3.6" fill="#3D85C6"/>
    <circle cx="446.7" cy="126.0" r="3.3000000000000003" class="empty"/>
    <circle cx="459.7" cy="126.0" r="3.3000000000000003" class="empty"/>
    <circle cx="513.5" cy="126.0" r="3.3000000000000003" class="empty"/>
    <circle cx="526.5" cy="126.0" r="3.3000000000000003" class="empty"/>
    <circle cx="593.3" cy="126.0" r="3.6" fill="#E07A5F"/>
  </g>

  <!-- Taglines -->
  <text x="410" y="170" text-anchor="middle" class="sub">structure · dataflow · blast radius</text>
  <text x="410" y="192" text-anchor="middle" class="sub" opacity="0.7">live · per-tenant · in-memory</text>
