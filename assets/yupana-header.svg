<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" fill="none">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E07A5F"/>
      <stop offset="50%" style="stop-color:#F2CC8F"/>
      <stop offset="100%" style="stop-color:#81B29A"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3D85C6;stop-opacity:0.35"/>
      <stop offset="50%" style="stop-color:#9B72AA"/>
      <stop offset="100%" style="stop-color:#3D85C6;stop-opacity:0.35"/>
    </linearGradient>
  </defs>
  <style>
    .title { font-family: 'Courier New', Courier, monospace; font-size: 76px; font-weight: bold; fill: url(#textGrad); }
    .sub { font-family: 'Courier New', Courier, monospace; font-size: 16px; fill: #81B29A; letter-spacing: 2px; }
    .rim { stroke: url(#boardGrad); stroke-width: 2.2; fill: none; }
    .div { stroke: #9B72AA; stroke-width: 1.5; opacity: 0.6; }
    .empty { fill: none; stroke: #9B72AA; stroke-opacity: 0.45; stroke-width: 1.2; }
  </style>

  <!-- YUPANA wordmark -->
  <text x="410" y="92" text-anchor="middle" class="title">YUPANA</text>

  <!-- Yupana board strip: compartments of decreasing capacity, some seeded -->
